<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form with Validation</title>
    <!-- Link to the CSS file inside the CSS folder -->
    <link rel="stylesheet" href="CSS/CSS_1.css">
    <!-- Link to the JavaScript file in the same directory -->
    <script src="JavaScript/JavaScript_2.js" defer></script>
</head>
<body>

    <div class="form-container">
        <h2>Contact Us</h2>
        <p>Please fill out the form below.</p>
        
        <!-- The onsubmit attribute calls our JavaScript function when the user clicks submit -->
        <form name="contactForm" onsubmit="return validateForm()">
            
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="firstname" placeholder="Your first name...">

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lastname" placeholder="Your last name...">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Your email address...">

            <input type="submit" value="Submit">
        </form>
    </div>

</body>
</html>
